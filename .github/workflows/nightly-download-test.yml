name: Nightly Download Test

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-ytdlp-version:
    name: check-ytdlp-version
    runs-on: ubuntu-latest
    outputs:
      pinned: ${{ steps.version-check.outputs.pinned }}
      latest: ${{ steps.version-check.outputs.latest }}
      stale: ${{ steps.version-check.outputs.stale }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check yt-dlp version staleness
        id: version-check
        run: |
          # Extract minimum pinned version from requirements.txt
          PINNED=$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          requirements = pathlib.Path("python/requirements.txt").read_text(encoding="utf-8")
          match = re.search(r"^\s*yt-dlp(?:\[[^\]]+\])?[><=]+\s*([0-9.]+)\s*$", requirements, re.MULTILINE)
          if not match:
              sys.stderr.write("::error::Could not extract pinned yt-dlp version from requirements.txt\n")
              raise SystemExit(1)
          print(match.group(1))
          PY
          )
          echo "pinned=$PINNED"

          # Get latest yt-dlp version from PyPI
          LATEST=$(curl -sf https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          if [ -z "$LATEST" ]; then
            echo "::error::Could not fetch latest yt-dlp version from PyPI"
            exit 1
          fi
          echo "latest=$LATEST"

          # Sanity-check both look like calver (YYYY.M.D)
          VERSION_RE='^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$'
          if ! [[ "$PINNED" =~ $VERSION_RE ]]; then
            echo "::error::PINNED version '$PINNED' doesn't look like a valid yt-dlp calver"
            exit 1
          fi
          if ! [[ "$LATEST" =~ $VERSION_RE ]]; then
            echo "::error::LATEST version '$LATEST' doesn't look like a valid yt-dlp calver"
            exit 1
          fi

          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$PINNED" != "$LATEST" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Bundled yt-dlp $PINNED is behind latest $LATEST"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "yt-dlp $PINNED is up to date"
          fi

  notify-on-staleness:
    name: notify-on-staleness
    runs-on: ubuntu-latest
    needs: check-ytdlp-version
    if: needs.check-ytdlp-version.outputs.stale == 'true'
    permissions:
      issues: write
    steps:
      - name: Create GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const pinned = '${{ needs.check-ytdlp-version.outputs.pinned }}';
            const latest = '${{ needs.check-ytdlp-version.outputs.latest }}';
            // PyPI normalizes "2026.02.04" → "2026.2.4"; GH tags keep zero-padding
            const parts = latest.split('.');
            if (parts.length < 3) throw new Error(`Unexpected version format: ${latest}`);
            const githubTag = [parts[0], parts[1].padStart(2, '0'), parts[2].padStart(2, '0')].join('.');
            const title = `yt-dlp update available: ${pinned} → ${latest}`;
            const body = `A newer version of yt-dlp is available.\n\n**Bundled:** \`${pinned}\`\n**Latest:** \`${latest}\`\n\n**Changelog:** https://github.com/yt-dlp/yt-dlp/releases/tag/${githubTag}\n\nUpdate \`python/requirements.txt\` to \`yt-dlp[default]>=${latest}\` and test locally.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              labels: 'yt-dlp-update',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              console.log('Issue already exists:', duplicate.html_url);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['yt-dlp-update'],
            });
