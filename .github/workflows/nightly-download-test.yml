name: Nightly Download Test

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  download-test:
    name: download-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv

      - name: Bundle dependencies (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/bundle-dependencies-macos.sh

      - name: Bundle dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/bundle-dependencies-linux.sh

      - name: Bundle dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bundle-dependencies-windows.ps1

      - name: Verify bundled Python path (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          PYTHON="${{ github.workspace }}/src-tauri/resources/python/bin/python3"
          test -f "$PYTHON" || (echo "Bundled Python not found at $PYTHON" && ls -la "${{ github.workspace }}/src-tauri/resources/python/bin/" 2>/dev/null || true && exit 1)

      - name: Run real-world download tests (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          FFMPEG_PATH: ${{ github.workspace }}/src-tauri/resources/ffmpeg/ffmpeg
          RUN_REAL_WORLD_TESTS: "1"
          YT_DLP_ENABLE_BROWSER_COOKIES: "false"
        run: |
          "${{ github.workspace }}/src-tauri/resources/python/bin/python3" -m pytest \
            python/test_downloader_real_world.py -s -v

      - name: Run real-world download tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FFMPEG_PATH: ${{ github.workspace }}\src-tauri\resources\ffmpeg\ffmpeg.exe
          RUN_REAL_WORLD_TESTS: "1"
          YT_DLP_ENABLE_BROWSER_COOKIES: "false"
        run: |
          & "${{ github.workspace }}\src-tauri\resources\python\python.exe" -m pytest `
            python\test_downloader_real_world.py -s -v

  notify-on-failure:
    name: notify-on-failure
    runs-on: ubuntu-latest
    needs: download-test
    if: failure() && needs.download-test.result == 'failure'
    permissions:
      issues: write
    steps:
      - name: Create GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `Nightly download test failed on ${date}`;
            const body = `One or more platforms failed in the nightly real-world download test.\n\n**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nCheck the [Actions tab](https://github.com/${{ github.repository }}/actions) for logs.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              labels: 'nightly-failure',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              console.log('Issue already exists:', duplicate.html_url);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['nightly-failure'],
            });
