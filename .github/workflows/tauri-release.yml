name: Tauri Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_linux_rpm:
        description: "Build Linux RPM artifact (adds substantial runtime)"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Validate macOS signing/notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to build unsigned/unnotarized macOS release artifacts."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: pnpm release:check-version

      - name: Prepare Apple notarization API key file
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Import Apple code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/apple-signing-cert.p12"
          keychain_path="$RUNNER_TEMP/apple-build.keychain-db"
          keychain_password="$(openssl rand -base64 24)"

          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path" 2>/dev/null; then
            printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$cert_path"
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1 || true)"
          if [ -z "$signing_identity" ]; then
            echo "::error::Failed to find Developer ID Application identity in imported certificate."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_BUILD_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Bundle dependencies
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          REQUIRE_SIGNED_BUNDLED_RUNTIMES: "true"
        run: ./scripts/bundle-dependencies-macos.sh

      - name: Build macOS bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg --ci

      - name: Verify macOS bundle trust
        env:
          REQUIRE_DEVELOPER_ID_SIGNATURE: "true"
          REQUIRE_NOTARIZATION: "true"
        run: ./scripts/verify-release-macos.sh

      - name: Cleanup imported keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${APPLE_BUILD_KEYCHAIN_PATH:-}" ] && [ -f "${APPLE_BUILD_KEYCHAIN_PATH}" ]; then
            security delete-keychain "${APPLE_BUILD_KEYCHAIN_PATH}" || true
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-arm64
          path: src-tauri/target/**/bundle/dmg/*.dmg
          retention-days: 30

  release-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: pnpm release:check-version

      - name: Bundle dependencies
        shell: pwsh
        run: ./scripts/bundle-dependencies-windows.ps1

      - name: Build Windows bundle
        shell: pwsh
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Verify Windows installer
        shell: pwsh
        env:
          REQUIRE_WINDOWS_SIGNATURE: ${{ vars.REQUIRE_WINDOWS_SIGNATURE }}
        run: ./scripts/verify-release-windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-x64
          path: src-tauri/target/**/bundle/nsis/*.exe
          retention-days: 30

  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm \
            squashfs-tools desktop-file-utils appstream zsync

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: pnpm release:check-version

      - name: Bundle dependencies
        run: ./scripts/bundle-dependencies-linux.sh

      - name: Decide Linux bundle targets
        env:
          INCLUDE_LINUX_RPM: ${{ github.event.inputs.include_linux_rpm || 'false' }}
          TAG_INCLUDE_LINUX_RPM: ${{ vars.RELEASE_INCLUDE_LINUX_RPM || 'false' }}
        run: |
          set -euo pipefail
          linux_bundles="appimage,deb"
          require_rpm="false"

          # Allow manual workflow_dispatch runs to opt into RPM.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INCLUDE_LINUX_RPM}" == "true" ]]; then
            linux_bundles="appimage,deb,rpm"
            require_rpm="true"
          # Tag releases stay fast by default; enable RPM via repo variable if needed.
          elif [[ "${GITHUB_REF}" == refs/tags/v* && "${TAG_INCLUDE_LINUX_RPM}" == "true" ]]; then
            linux_bundles="appimage,deb,rpm"
            require_rpm="true"
          fi

          echo "LINUX_BUNDLES=${linux_bundles}" >> "$GITHUB_ENV"
          echo "REQUIRE_RPM=${require_rpm}" >> "$GITHUB_ENV"
          echo "Selected Linux bundles: ${linux_bundles}"

      - name: Configure faster rpmbuild macros
        if: env.REQUIRE_RPM == 'true'
        run: |
          set -euo pipefail
          cat > ~/.rpmmacros <<'EOF'
          %debug_package %{nil}
          %_build_id_links none
          %_binary_payload w3.zstdio
          %_source_payload w3.zstdio
          EOF

      - name: Build Linux bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles "${LINUX_BUNDLES}" --ci --verbose

      - name: Verify Linux artifacts
        run: ./scripts/verify-release-linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-x64
          path: |
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-macos, release-windows, release-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm

  trigger-website-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-release]
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger website deploy from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/actions/workflows/deploy-website.yml/dispatches" \
            -f ref='main' \
            -F inputs[release_tag]="${RELEASE_TAG}"
