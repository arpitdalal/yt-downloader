glob_matcher: doublestar

pre-commit:
  commands:
    biome:
      glob: "**/*.{ts,tsx,js,jsx,json}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "**/*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    ruff-fix:
      glob: "**/*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml
      stage_fixed: true

# First line must match Conventional Commits (types below); Merge/Revert lines allowed.
commit-msg:
  commands:
    conventional-commit:
      run: |
        bash -c 'm=$(head -n1 "$1"); case "$m" in "Merge "*|"Revert "*) exit 0;; esac; printf "%s\n" "$m" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\([^)]+\))?(!)?: .+" || { echo "Commit message must follow Conventional Commits" >&2; exit 1; }' _ {1}

pre-push:
  commands:
    release-tag-version:
      run: pnpm release:check-pushed-tags
      use_stdin: true
    biome:
      run: pnpm lint:ts
    ruff:
      run: pnpm lint:python
    clippy:
      run: pnpm lint:rust
    shellcheck:
      run: pnpm lint:shell
    typecheck:
      run: pnpm typecheck
